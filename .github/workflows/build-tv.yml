name: Build Artemide TV

on:
  push:
    branches: [ tv-c7k ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out code (with moonlight-common-c submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install "platforms;android-36" "ndk;27.0.12077973" > /dev/null
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build TV APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            assembleNonRoot_gameTv \
            -ParmOnly \
            -PskipLintVital \
            -PciVersionCode=$((570000 + ${{ github.run_number }}))

      - name: Collect APKs
        run: |
          set -e
          OUT=app/build/outputs/apk/nonRoot_game/tv
          ls -la "$OUT"
          mkdir -p dist
          cp "$(ls $OUT/*universal*.apk | head -n1)" dist/ArtemideTV.apk
          cp "$(ls $OUT/*arm64-v8a*.apk | head -n1)" dist/ArtemideTV-arm64-v8a.apk
          cp "$(ls $OUT/*armeabi-v7a*.apk | head -n1)" dist/ArtemideTV-armeabi-v7a.apk
          ls -la dist

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtemideTV-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (stable link for the TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: Artemide TV build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Artemide TV for TCL C7K (MediaTek Pentonic 700 / MT5896), built from ${{ github.sha }}.

            Install on the TV with the Downloader app using this link (always the newest build):
            https://github.com/${{ github.repository }}/releases/latest/download/ArtemideTV.apk

            ArtemideTV.apk works on any ARM TV. The per-ABI files are smaller alternatives.
