name: Build Artemide TV

on:
  push:
    branches: [ tv-c7k ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: this image ships the Android SDK (ubuntu-latest moves to a new image soon)
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out code (with moonlight-common-c submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Apply TV patches to moonlight-common-c
        run: bash tv-patches/apply.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the Android SDK that comes with the runner image (no setup action needed)
      - name: Install Android platform and NDK
        run: |
          set -eo pipefail
          mkdir -p ci-logs
          exec > >(tee -a ci-logs/sdk.log) 2>&1
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "No sdkmanager on the runner; installing Android command-line tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Android SDK: $SDK"
          echo "sdkmanager: $SDKMANAGER"
          (yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null) || true
          # Downloads from Google occasionally arrive broken ("Error on ZipFile"): retry
          for attempt in 1 2 3 4; do
            if "$SDKMANAGER" --sdk_root="$SDK" --install "platforms;android-36" "ndk;27.0.12077973" > /dev/null &&
               [ -f "$SDK/ndk/27.0.12077973/source.properties" ]; then
              break
            fi
            echo "sdkmanager attempt $attempt failed, retrying"
            rm -rf "$SDK/ndk/27.0.12077973" "$SDK/.temp" "$HOME/.android/cache"
            sleep $((attempt * 15))
          done
          [ -f "$SDK/ndk/27.0.12077973/source.properties" ]
          ls "$SDK/ndk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build TV APK
        run: |
          set -o pipefail
          mkdir -p ci-logs
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            assembleNonRoot_gameTv \
            -ParmOnly \
            -PskipLintVital \
            -PciVersionCode=$((570000 + ${{ github.run_number }})) 2>&1 | tee ci-logs/build.log

      # If anything failed: the key error lines become annotations, and the full logs are
      # pushed to the 'ci-logs' branch (job logs aren't always reachable from outside)
      - name: Report build errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-logs
          cat ci-logs/*.log 2>/dev/null | grep -E -A3 "error:|error ::|e: |FAILURE:|What went wrong|Execution failed|Could not |AAPT: error|ERROR:|fatal error|make: \*\*\*|undefined reference|Exception" | head -n 150 > /tmp/errors.txt || true
          split -l 30 /tmp/errors.txt /tmp/errpart- || true
          for f in /tmp/errpart-*; do
            [ -s "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build log excerpt::$msg"
          done
          tmp=$(mktemp -d)
          cp ci-logs/*.log "$tmp"/ 2>/dev/null || echo "no logs captured" > "$tmp/none.log"
          cd "$tmp"
          git init -q && git checkout -q -b ci-logs && git add . && \
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build logs for run ${{ github.run_number }}" && \
            git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" ci-logs || true

      - name: Collect APKs
        run: |
          set -e
          OUT=app/build/outputs/apk/nonRoot_game/tv
          ls -la "$OUT"
          mkdir -p dist
          cp "$(ls $OUT/*universal*.apk | head -n1)" dist/ArtemideTV.apk
          cp "$(ls $OUT/*arm64-v8a*.apk | head -n1)" dist/ArtemideTV-arm64-v8a.apk
          cp "$(ls $OUT/*armeabi-v7a*.apk | head -n1)" dist/ArtemideTV-armeabi-v7a.apk
          cp tv-tools/latency-test.html dist/latency-test.html
          cp tv-tools/stream-test.html dist/stream-test.html
          ls -la dist

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtemideTV-build-${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release (stable link for the TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-build-${{ github.run_number }}
          name: Artemide TV build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.apk
            dist/latency-test.html
            dist/stream-test.html
          body: |
            Artemide TV for TCL C7K (MediaTek Pentonic 700 / MT5896), built from ${{ github.sha }}.

            Install on the TV with the Downloader app using this link (always the newest build):
            https://github.com/${{ github.repository }}/releases/latest/download/ArtemideTV.apk

            ArtemideTV.apk works on any ARM TV. The per-ABI files are smaller alternatives.

            latency-test.html is for the PC: with Settings > Latency test on, open it full screen in
            the stream and press A, B, X or Y about 20 times; the stream report shows button-to-screen
            latency.

            stream-test.html is for the PC: a steady moving picture for the auto-tune (stream menu >
            Auto-tune), so every test sees the same load. Open it full screen before starting.
